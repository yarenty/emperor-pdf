name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: emperor-pdf:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: image architecture
        run: docker image inspect emperor-pdf:smoke --format '{{.Os}}/{{.Architecture}}'
      - name: PDFium in the image
        run: docker run --rm --entrypoint sh emperor-pdf:smoke -c 'ls -l /opt/pdfium/libpdfium.so'
      - name: smoke test over stdio
        run: scripts/docker-smoke.sh emperor-pdf:smoke
