name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# PDFium is not bundled: it is loaded at runtime and installed separately
# (scripts/fetch-pdfium.sh or https://github.com/bblanchon/pdfium-binaries).
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel-mac runners (macos-13) are retired; cross-compile on Apple Silicon.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Collect licences
        shell: bash
        run: |
          out=target/${{ matrix.target }}/release
          cp LICENSE-MIT LICENSE-APACHE README.md "$out/"
          # Licences of the fonts embedded in the binary.
          cat assets/fonts/LICENSE-OFL-1.1.txt > "$out/FONTS-NOTICE"
          printf '\n================================================================================\n\n' >> "$out/FONTS-NOTICE"
          cat assets/fonts/LICENSE-DejaVu.txt >> "$out/FONTS-NOTICE"
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf emperor-pdf-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            emperor-pdf LICENSE-MIT LICENSE-APACHE README.md FONTS-NOTICE
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path emperor-pdf.exe,LICENSE-MIT,LICENSE-APACHE,README.md,FONTS-NOTICE -DestinationPath "emperor-pdf-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: emperor-pdf-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/emperor-pdf-*.tar.gz
            target/${{ matrix.target }}/release/emperor-pdf-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum emperor-pdf-* > SHA256SUMS && cat SHA256SUMS
      # Build provenance, checked with `gh attestation verify <archive> --repo yarenty/emperor-pdf`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/emperor-pdf-*
            dist/SHA256SUMS
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            PDFium is not included. Install it with `scripts/fetch-pdfium.sh` from a checkout, or
            download `pdfium-<os>-<cpu>.tgz` from https://github.com/bblanchon/pdfium-binaries
            (release chromium/7881) and pass `--pdfium-dir`. Without it, text falls back to
            lopdf and page rendering is unavailable.

            Check an archive: `sha256sum -c SHA256SUMS --ignore-missing` and
            `gh attestation verify <archive> --repo yarenty/emperor-pdf`.
          files: |
            dist/emperor-pdf-*
            dist/SHA256SUMS
