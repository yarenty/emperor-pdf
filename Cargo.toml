[package]
name = "emperor-pdf"
version = "0.1.3"
edition = "2024"
# typst 0.15 needs 1.92
rust-version = "1.92"
description = "MCP server for PDFs in one folder: read, search, render, merge, extract and create from Markdown"
license = "MIT OR Apache-2.0"
authors = ["yarenty <yarenty@gmail.com>"]
repository = "https://github.com/yarenty/emperor-pdf"
homepage = "https://github.com/yarenty/emperor-pdf"
readme = "README.md"
keywords = ["mcp", "mcp-server", "pdf", "typst", "pdfium"]
categories = ["command-line-utilities", "text-processing"]

[features]
default = ["create"]
# pdf_create (Markdown to PDF with Typst and embedded fonts). Without it the binary is
# read-and-render only and much smaller.
create = ["dep:typst", "dep:typst-pdf", "dep:typst-layout", "dep:pulldown-cmark"]

[dependencies]
emperor-mcp = { version = "0.4", features = ["cli"] }
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cap-std = "4.0"
# Dynamic binding only: PDFium is loaded at runtime, never linked or bundled.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
png = "0.18"
lopdf = "0.46"
typst = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
glob = "0.3"
regex = "1"
base64 = "0.22"
# `url` sources: HTTPS with rustls (ring) and the operating system's trust store.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
emperor-mcp = { version = "0.4", features = ["cli", "testkit"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"

[[test]]
name = "tools"
# The fixtures are typeset with Typst.
required-features = ["create"]

[profile.release]
lto = "thin"
strip = true
