[package]
name = "emperor-pdf"
version = "0.1.0"
edition = "2024"
# typst 0.15 needs 1.92
rust-version = "1.92"
description = "MCP server for PDFs in one folder: read, search, render, merge, extract and create from Markdown"
license = "MIT OR Apache-2.0"
authors = ["yarenty <yarenty@gmail.com>"]
repository = "https://github.com/yarenty/emperor-pdf"
homepage = "https://github.com/yarenty/emperor-pdf"
readme = "README.md"
keywords = ["mcp", "mcp-server", "pdf", "typst", "pdfium"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
emperor-mcp = "0.2"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cap-std = "4.0"
# Dynamic binding only: PDFium is loaded at runtime, never linked or bundled.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
png = "0.18"
lopdf = "0.46"
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
pulldown-cmark = { version = "0.13", default-features = false }
glob = "0.3"
regex = "1"
base64 = "0.22"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
